<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120914"><title>Create a Surprise 💗</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="ambient"><i>♥</i><i>♡</i><i>✦</i><i>❀</i><i>♥</i></div><main class="page"><section class="glass creator">
<div class="mini-heart">💗</div><p class="eyebrow">SURPRISE BUILDER</p><h1>Create something <em>beautiful.</em></h1><p class="lead small">Add a name, four memories and a secret passcode. The share link stays short because your photos are stored separately.</p>
<form id="createForm"><label>Person's name<input id="name" maxlength="40" required placeholder="e.g. Ananya"></label><label>Birthday message <span>(optional)</span><textarea id="message" maxlength="500" placeholder="Wishing you endless happiness..."></textarea></label><label>Secret passcode<input id="passcode" maxlength="30" minlength="4" required placeholder="4–30 characters" autocomplete="off"></label><label>Four special photos</label><div class="photo-grid">
<label class="upload"><input class="photo-input" type="file" accept="image/*" data-index="0"><span>＋</span><small>Photo 1</small></label><label class="upload"><input class="photo-input" type="file" accept="image/*" data-index="1"><span>＋</span><small>Photo 2</small></label><label class="upload"><input class="photo-input" type="file" accept="image/*" data-index="2"><span>＋</span><small>Photo 3</small></label><label class="upload"><input class="photo-input" type="file" accept="image/*" data-index="3"><span>＋</span><small>Photo 4</small></label></div>
<button class="primary full" type="submit" id="createBtn">Create Share Link ✨</button><p id="status" class="form-note"></p></form>
<div id="result" class="result hidden"><div class="success-icon">✓</div><h2>Your surprise is ready!</h2><p>Now copy the short link and send it.</p><div class="share-row"><input id="shareLink" readonly><button id="copyBtn" class="secondary">Copy</button></div><a id="openBtn" class="primary full center">Open Surprise</a><button id="newBtn" class="text-btn">Create another</button></div>
</section></main><script src="js/config.js"></script><script src="js/create.js"></script></body></html>

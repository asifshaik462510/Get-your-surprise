<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120914"><title>Your Surprise 💌</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="particles" class="particles"></div><main class="page"><section id="lockedView" class="glass lock"><div class="lock-icon">💌</div><p class="eyebrow">A PRIVATE SURPRISE</p><h1>Something <em>special</em> is waiting.</h1><p>Enter the secret passcode to unlock it.</p><div class="code-row"><input id="codeInput" type="password" maxlength="30" placeholder="Secret passcode" autocomplete="off"><button id="unlockBtn" class="primary">Unlock</button></div><p id="errorMsg" class="error"></p><a href="create.html" class="text-btn">Create your own surprise →</a></section>
<section id="revealView" class="reveal hidden"><div class="reveal-hero"><p class="eyebrow">FOR YOU, WITH LOVE</p><h1>Happy Birthday,<br><em id="personName">You</em> 🎂</h1><p id="introMessage" class="lead"></p><button id="beginReveal" class="primary">Open your memories ✨</button></div>
<div id="gallery" class="gallery hidden"><div class="memory" id="memory0"><div class="photo-wrap"><img id="photo0" alt="Memory 1"></div><span>01</span></div><div class="memory" id="memory1"><div class="photo-wrap"><img id="photo1" alt="Memory 2"></div><span>02</span></div><div class="memory" id="memory2"><div class="photo-wrap"><img id="photo2" alt="Memory 3"></div><span>03</span></div><div class="memory" id="memory3"><div class="photo-wrap"><img id="photo3" alt="Memory 4"></div><span>04</span></div></div>
<div id="finalMessage" class="final hidden"><div class="final-card glass"><div class="mini-heart">💗</div><p class="eyebrow">ONE LAST THING</p><h2>For <em id="finalName">you</em></h2><p id="finalText"></p><div class="heart-line">♡ ✦ ♡</div></div></div></section></main><script src="js/config.js"></script><script src="js/surprise.js"></script></body></html>
